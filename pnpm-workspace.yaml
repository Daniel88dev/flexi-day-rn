# Supply-chain policy (T-561), the same block in every Flexi Day repo.
minimumReleaseAge: 4320 # 3 days; pnpm enforces it strictly only when it is set explicitly
minimumReleaseAgeExcludePrune: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days
trustPolicyExcludePrune: true
blockExoticSubdeps: true
trustLockfile: false

allowBuilds:
  "@tailwindcss/oxide": false
  esbuild: false
  # Jest 30's file watcher and resolver. Both load the prebuilt binding from their platform optional
  # dependency; the scripts only build from source or fetch a missing binding.
  "@parcel/watcher": false
  unrs-resolver: false
  # eas-cli's. dtrace-provider compiles an optional DTrace binding that bunyan loads in a try/catch,
  # and protobufjs's postinstall only prints a version-scheme warning.
  dtrace-provider: false
  protobufjs: false
# Keeps the lockfile free of the packageManagerDependencies document, which GitHub's dependency
# graph cannot parse yet (dependabot-core#15904). Drop it once that issue closes.
pmOnFail: ignore
skills:
  dirs: []
