# Supply-chain policy (T-561), the same block in every Flexi Day repo.
minimumReleaseAge: 4320 # 3 days; pnpm enforces it strictly only when it is set explicitly
minimumReleaseAgeExcludePrune: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days
trustPolicyExcludePrune: true
blockExoticSubdeps: true
trustLockfile: false

# Expo started publishing with provenance on the SDK 58 canaries (2026-08-06). Its maintainers still
# publish SDK 57 patches by hand without it, so pnpm reads each one as a downgrade. These go when
# the app moves to SDK 58.
trustPolicyExclude:
  - "@expo/cli@57.0.32"
  - "@expo/config-plugins@57.0.11"
  - "@expo/config@57.0.10"
  - "@expo/fingerprint@0.20.14"
  - "@expo/image-utils@0.11.6"
  - "@expo/inline-modules@0.1.8"
  - "@expo/local-build-cache-provider@57.0.9"
  - "@expo/metro-config@57.0.13"
  - "@expo/metro-file-map@57.0.4"
  - "@expo/metro-runtime@57.0.17"
  - "@expo/prebuild-config@57.0.19"
  - "@expo/require-utils@57.0.6"
  - "@expo/router-server@57.0.14"
  - "@expo/ui@57.0.26"
  - "babel-preset-expo@57.0.16"
  - "expo-asset@57.0.20"
  - "expo-auth-session@57.0.16"
  - "expo-constants@57.0.22"
  - "expo-crypto@57.0.4"
  - "expo-dev-client@57.0.20"
  - "expo-dev-launcher@57.0.21"
  - "expo-dev-menu@57.0.20"
  - "expo-linking@57.0.13"
  - "expo-location@57.0.22"
  - "expo-modules-autolinking@57.0.16"
  - "expo-modules-core@57.0.24"
  - "expo-modules-jsi@57.1.3"
  - "expo-network@57.0.3"
  - "expo-notifications@57.0.24"
  - "expo-router@57.0.29"
  - "expo-sqlite@57.0.4"
  - "expo@57.0.31"
  - "jest-expo@57.0.6"

allowBuilds:
  "@tailwindcss/oxide": false
  esbuild: false
# Keeps the lockfile free of the packageManagerDependencies document, which GitHub's dependency
# graph cannot parse yet (dependabot-core#15904). Drop it once that issue closes.
pmOnFail: ignore
skills:
  dirs: []
