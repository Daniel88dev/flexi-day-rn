version: 2

updates:
  # The npm ecosystem also covers pnpm and reads pnpm-lock.yaml. Expo pins the versions of the
  # packages it ships with the SDK, and Dependabot cannot run `pnpm expo install --fix`. So Expo
  # moves by patch only, in one group, and whoever handles that PR runs `pnpm expo install --fix`
  # on its branch (see README). SDK upgrades are by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Matches minimumReleaseAge in pnpm-workspace.yaml, so a routine bump never proposes a version
    # the install would reject as too new.
    cooldown:
      default-days: 3
    groups:
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - "@expo/*"
          - jest-expo
        update-types:
          - patch
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: expo
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: expo-*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: jest-expo
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Exact SDK pins: only `pnpm expo install --fix` moves these.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-test-renderer
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: react-native-svg
      - dependency-name: "@types/jest"
      # SDK tilde ranges: patches only.
      - dependency-name: react-native-screens
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-gesture-handler
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-safe-area-context
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: jest
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Pinned exactly by docs/adr/0001-nativewind-v5-release-candidate.md.
      - dependency-name: nativewind
      - dependency-name: react-native-css
      - dependency-name: tailwindcss
      - dependency-name: "@tailwindcss/postcss"
      - dependency-name: lightningcss

  # Actions are pinned to commit SHAs; this is what keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init and analyze must move together, or the action aborts on two versions of itself.
      codeql-action:
        patterns:
          - github/codeql-action*
