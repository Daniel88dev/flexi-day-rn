# Birthdays (T-354): set a birthday with a year, see the age on the user's own day, remove the
# year and see the age go. Runs on 18 October 2026, signed in as owner@dev.local (lanes view),
# with the owner's birthday stored as 25 October without a year:
#   npm run dev:login:rn -- owner@dev.local --to /dashboard --udid <udid>
# The wheel offers 2000 for a birthday without a year: age 25 today, 26 on the day.
appId: com.flexiday.app
---
- openLink: flexiday:///dashboard
# Pull to refresh, so the store holds what the server stores now.
- swipe:
    start: 50%, 25%
    end: 50%, 75%
    duration: 800
- waitForAnimationToEnd
- tapOn:
    id: calendar-day-2026-10-25
- assertVisible:
    id: "day-list-birthday-.*"
    text: "Your birthday"
- tapOn:
    id: "day-list-birthday-.*"
- assertVisible:
    id: settings-birthday
    text: ".*No year, age hidden.*"
- tapOn:
    id: settings-birthday
- tapOn:
    id: birthday-sheet-year
- tapOn:
    id: birthday-sheet-save
- assertVisible:
    id: settings-birthday
    text: ".*2000, age 25.*"
- tapOn:
    id: stack-back
- tapOn:
    id: calendar-day-2026-10-25
- assertVisible:
    id: "day-list-birthday-.*"
    text: "Your birthday · 26"
- tapOn:
    id: "day-list-birthday-.*"
- tapOn:
    id: settings-birthday
- tapOn:
    id: birthday-sheet-year
- tapOn:
    id: birthday-sheet-save
- assertVisible:
    id: settings-birthday
    text: ".*No year, age hidden.*"
- tapOn:
    id: stack-back
- tapOn:
    id: calendar-day-2026-10-25
- assertVisible:
    id: "day-list-birthday-.*"
    text: "Your birthday"
- assertNotVisible:
    text: "Your birthday · 26"
