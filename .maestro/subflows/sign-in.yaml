appId: com.flexiday.app
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Sign in"
- assertVisible: "Welcome back"
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "sign-in-submit"
# iOS offers to save the password once the form is gone, in a sheet over the next screen. On a
# busy runner it can take well over the default five seconds to appear.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 60000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
