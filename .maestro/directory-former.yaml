# Directory, an HR viewer of the Former list (T-516): the More sheet's People section opens the
# directory, the Current/Former switch lists the ended spells, and an empty search offers to clear.
# Signed in as alice@dev.local holding HR, after dev:scenario, with the owner's organization on
# Enterprise and its directory turned on, and Frank removed from Dev Support so his spell ended:
#   dev_set_plan ENTERPRISE, POST /api/organization/directory/enable { "agreementVersion": 1 },
#   DELETE /api/group-user/<Dev Support>/<Frank>
#   as the owner: PUT /api/directory/<org>/roles/<Alice's employment> { "roles": ["HR"] }
#   npm run dev:login:rn -- alice@dev.local --to /dashboard --udid <udid>
appId: com.flexiday.app
---
- openLink: flexiday:///dashboard
- tapOn:
    id: tab-more
- assertVisible: "(?i)people"
- tapOn:
    id: more-directory
- assertVisible:
    id: directory-segment-current
- assertVisible:
    id: "directory-row-.*"
    text: "Alice Novak.*You"
- assertVisible:
    id: "directory-row-.*"
    text: "Olivia Owner.*"
- takeScreenshot: .maestro/screenshots/directory-current-hr
- tapOn:
    id: directory-segment-former
- assertVisible: "by end date"
- assertVisible:
    id: "directory-former-row-.*"
    text: "Frank Benes, .*Ended .*"
- takeScreenshot: .maestro/screenshots/directory-former-hr
- tapOn:
    id: directory-segment-current
- tapOn:
    id: directory-search
- inputText: "nobody here"
- assertVisible: "No one matches"
- tapOn:
    id: directory-clear-filters
- assertVisible:
    id: "directory-row-.*"
    text: "Alice Novak.*"
